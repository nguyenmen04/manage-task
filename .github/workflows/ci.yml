name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Auth Dependencies
        working-directory: ./backend-auth
        run: npm ci

      - name: Install Tasks Dependencies
        working-directory: ./backend-tasks
        run: npm ci

      - name: Run Auth Tests
        working-directory: ./backend-auth
        run: npm test --if-present || true

      - name: Run Tasks Tests
        working-directory: ./backend-tasks
        run: npm test --if-present || true

  frontend-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: manage_task
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Auth Dependencies
        working-directory: ./backend-auth
        run: npm ci

      - name: Install Tasks Dependencies
        working-directory: ./backend-tasks
        run: npm ci

      - name: Initialize Database
        run: PGPASSWORD=password psql -h localhost -U postgres -d manage_task -f init.sql

      - name: Start Auth Service
        working-directory: ./backend-auth
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: auth_db
          DB_PORT: 5432
          JWT_SECRET: test_secret_123
          PORT: 5001
        run: npm start &

      - name: Start Tasks Service
        working-directory: ./backend-tasks
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: task_db
          DB_PORT: 5432
          JWT_SECRET: test_secret_123
          PORT: 5002
        run: npm start &

      - name: Wait for Services
        run: npx wait-on tcp:127.0.0.1:5001 tcp:127.0.0.1:5002

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run dev
          wait-on: 'http://127.0.0.1:5173'

      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 7

  docker-build-push:
    name: Build & Push Docker Images
    needs: [backend-test, frontend-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Auth Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-auth
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/manage-task-auth:latest

      - name: Build and Push Tasks Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-tasks
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/manage-task-tasks:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/manage-task-frontend:latest
