server {
    listen 80;
    
    # Chỉ định thư mục chứa file tĩnh do React sinh ra
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Chuyển hướng các request bắt đầu bằng /api/auth sang backend-auth
    location /api/auth/ {
        proxy_pass http://backend-auth:5001/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Chuyển hướng các request bắt đầu bằng /api/tasks sang backend-tasks
    location /api/tasks/ {
        proxy_pass http://backend-tasks:5002/tasks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Quy tắc quan trọng nhất cho Single Page Application (React Router)
    # Bất kể người dùng gõ URL gì, nếu file không tồn tại thì tự động trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
