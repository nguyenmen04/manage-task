apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: manage-task
data:
  DB_HOST: "postgres-service"
  DB_USER: "postgres"
  DB_NAME: "auth_db"
  DB_PORT: "5432"
  JWT_SECRET: "secret_key_123"
  PORT: "5001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: manage-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # Thay 'your-dockerhub-username' bằng username thật trên Docker Hub của bạn
          image: your-dockerhub-username/manage-task-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: auth-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: manage-task
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP
