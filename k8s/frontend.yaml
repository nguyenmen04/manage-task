apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: manage-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Thay 'your-dockerhub-username' bằng username thật trên Docker Hub của bạn
          image: your-dockerhub-username/manage-task-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: manage-task
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
